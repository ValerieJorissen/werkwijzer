name: Losse pagina's bijwerken
on:
  push:
    branches: [main]
    paths: ["index.html", "tools/**"]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paginas
  cancel-in-progress: false
jobs:
  maak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pagina's maken
        run: python3 tools/maak_paginas.py
      - name: Opslaan
        run: |
          git config user.name "valcature-bot"
          git config user.email "valcature-bot@users.noreply.github.com"
          git add -A vacatures vakgebied tips sitemap.xml
          if git diff --cached --quiet; then echo "Niets veranderd"; exit 0; fi
          git commit -m "Losse pagina's bijgewerkt"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
