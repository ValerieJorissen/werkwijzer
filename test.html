<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valcature test</title><meta name="robots" content="noindex">
<style>body{font:18px/1.5 system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;background:#F6F1E7;color:#17221D}button{font:inherit;font-weight:700;padding:14px 22px;border-radius:999px;border:2px solid #17221D;background:#FF6A2B;color:#fff;cursor:pointer;margin:6px 0}#uit{margin-top:16px;white-space:pre-wrap}</style></head><body>
<h1>Valcature – test Google Sheet</h1>
<p>Klik op de knoppen. Kijk daarna in je Google Sheet of er rijen met "TEST" bij zijn gekomen.</p>
<button id="a">1. Test met fetch</button><br><button id="b">2. Test met sendBeacon</button><br><button id="c">3. Test met formulier</button>
<div id="uit"></div>
<p><b>Antwoord van Google (na knop 3):</b></p><iframe name="verborgen" style="width:100%;height:160px;border:2px solid #17221D;border-radius:12px;background:#fff"></iframe>
<form id="f" method="POST" target="verborgen" enctype="text/plain" style="display:none"><input name="x"></form>
<script>
const U="https://script.google.com/macros/s/AKfycbwDSqWW8Micq4kSPMRpidBPWKzs-VLyfyfRxF8JGrnu4wOy7FNHUVMOs-aBogJsmZdi/exec";
const log=t=>{document.getElementById("uit").textContent+=new Date().toLocaleTimeString()+"  "+t+"\n"};
const body=m=>JSON.stringify({sessie:"test",modus:"TEST "+m+" (mag weg)",scherm:navigator.userAgent.slice(0,120)});
document.getElementById("a").onclick=()=>{fetch(U,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:body("fetch")}).then(()=>log("fetch verstuurd")).catch(e=>log("fetch FOUT: "+e))};
document.getElementById("b").onclick=()=>{log("sendBeacon: "+navigator.sendBeacon(U,new Blob([body("beacon")],{type:"text/plain"})))};
document.getElementById("c").onclick=()=>{const f=document.getElementById("f");f.action=U;f.x.name=body("formulier").slice(0,-1)+',"_":"';f.x.value='"}';f.submit();log("formulier verstuurd")};
</script></body></html>
